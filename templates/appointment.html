<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDSYS - Appointment Booking</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .box {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .box-header {
            margin-bottom: 20px;
        }

        .box-header h2 {
            margin: 0;
            color: #1f2937;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: #f9fafb;
            box-sizing: border-box;
        }

        .field textarea {
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="content">
    <div class="box">

        <div class="box-header">
            <h2>Book an Appointment</h2>
        </div>

        <p>Please fill the form below. We will get back to you shortly.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div style="margin: 12px 0;">
              {% for category, message in messages %}
                <div style="padding:10px 12px;
                            border-radius:8px;
                            margin-bottom:8px;
                            background:#f3f4f6;
                            border:1px solid #e5e7eb;">
                  <strong>{{ category|capitalize }}:</strong> {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/appointment" method="POST">

            <div class="field">
                <label for="appointment_type">Appointment Type</label>
                <select id="appointment_type" name="appointment_type" required>
                    <option value="new" selected>New Appointment</option>
                    <option value="followup">Revisit / Follow-up</option>
                </select>
            </div>

            <div class="field" id="previous_appointment_field" style="display:none;">
                <label for="previous_appointment_id">
                    Previous appointment reference (optional)
                </label>

                <input id="previous_appointment_id"
                       name="previous_appointment_id"
                       type="text"
                       placeholder="Enter previous appointment id/reference">
            </div>

            <div class="field">
                <label for="name">Name</label>
                <input id="name"
                       name="name"
                       type="text"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email"
                       name="email"
                       type="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="field">
                <label for="phone">Phone Number</label>
                <input id="phone"
                       name="phone"
                       type="tel"
                       placeholder="Enter your phone number"
                       required
                       maxlength="15"
                       pattern="^[0-9]{7,15}$">
            </div>

            <div class="field">
                <label for="doctor">Select a Doctor</label>

                <select id="doctor" name="doctor" required>
                    <option value="">-- Choose a doctor --</option>
                    {% if doctors %}
                        {% for d in doctors %}
                            <option value="{{ d['username'] }}">
                                {{ d['firstname'] }} {{ d['lastname'] }}
                            </option>
                        {% endfor %}
                    {% endif %}
                </select>
            </div>

            <div class="field">
                <label for="appointment_date">Appointment Date</label>

                <input id="appointment_date"
                       name="appointment_date"
                       type="date"
                       required>
            </div>

            <div class="field">
                <label for="appointment_slot">Appointment Time Slot</label>

                <select id="appointment_slot"
                        name="appointment_slot"
                        required>
                    <option value="">-- Select a time slot --</option>
                </select>
            </div>

            <!-- Hidden backend field -->
            <input type="hidden"
                   id="time_schedule"
                   name="time_schedule"
                   value="">

            <div class="field">
                <label for="issue">Health Issue</label>

                <textarea id="issue"
                          name="issue"
                          rows="4"
                          placeholder="Describe your health issue"
                          required></textarea>
            </div>

            <button class="btn" type="submit">
                Submit Appointment
            </button>

        </form>
    </div>
</div>

<script>
    (function () {
        const typeSelect = document.getElementById('appointment_type');
        const prevField = document.getElementById('previous_appointment_field');

        function sync() {
            prevField.style.display =
                (typeSelect.value === 'followup')
                ? 'block'
                : 'none';
        }

        typeSelect.addEventListener('change', sync);
        sync();
    })();

    (function () {

        const dateInput = document.getElementById('appointment_date');
        const slotSelect = document.getElementById('appointment_slot');
        const doctorSelect = document.getElementById('doctor');
        const hidden = document.getElementById('time_schedule');

        function pad2(n) {
            return String(n).padStart(2, '0');
        }

        function minutesToHHMM(mins) {
            const hh = Math.floor(mins / 60);
            const mm = mins % 60;
            return `${pad2(hh)}:${pad2(mm)}`;
        }

        function buildSlotsForDate(d) {

            const day = d.getDay();

            let startMin = 0;
            let endMin = 0;

            // Mon-Fri
            if (day >= 1 && day <= 5) {
                startMin = 8 * 60;
                endMin = 20 * 60;
            }

            // Saturday
            else if (day === 6) {
                startMin = 9 * 60;
                endMin = 17 * 60;
            }

            // Sunday
            else {
                startMin = 10 * 60;
                endMin = 14 * 60;
            }

            const slots = [];

            for (let t = startMin; t <= endMin; t += 30) {
                slots.push(t);
            }

            return slots;
        }

        function clearSlots() {

            slotSelect.innerHTML =
                '<option value="">-- Select a time slot --</option>';

            hidden.value = '';
        }

        function generateSlots() {

            const dateStr = dateInput.value;
            const doctor = doctorSelect.value;

            if (!dateStr || !doctor) {
                clearSlots();
                return;
            }

            const d = new Date(dateStr + 'T00:00:00');

            const slots = buildSlotsForDate(d);

            slotSelect.innerHTML =
                '<option value="">-- Select a time slot --</option>';

            slots.forEach((t) => {

                const time = minutesToHHMM(t);

                const opt = document.createElement('option');

                opt.value = time;
                opt.textContent = time;

                slotSelect.appendChild(opt);
            });
        }

        function syncHidden() {

            if (!dateInput.value || !slotSelect.value) {
                hidden.value = '';
                return;
            }

            hidden.value =
                `${dateInput.value} ${slotSelect.value}`;
        }

        dateInput.addEventListener('change', generateSlots);
        doctorSelect.addEventListener('change', generateSlots);
        slotSelect.addEventListener('change', syncHidden);

        clearSlots();

    })();
</script>

</body>
</html>
